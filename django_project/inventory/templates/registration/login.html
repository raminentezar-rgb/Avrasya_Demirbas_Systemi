{% load static %}
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avrasya Demirbaş | Yönetici Girişi</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            color: #fff;
        }
        
        .admin-login-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
            padding: 3rem;
            width: 100%;
            max-width: 450px;
            position: relative;
            overflow: hidden;
        }
        
        .admin-login-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.05), transparent);
            transform: skewX(-25deg);
            animation: shine 6s infinite;
        }
        
        @keyframes shine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }
        
        .logo-container {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        
        .logo-container img {
            height: 70px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }
        
        .admin-login-title {
            font-weight: 800;
            font-size: 1.8rem;
            background: linear-gradient(to right, #ffffff, #a8c0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 0.5rem;
        }
        
        .admin-login-subtitle {
            color: #a8c0ff;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .form-floating > .form-control {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            border-radius: 12px;
        }
        
        .form-floating > .form-control:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: #4facfe;
            box-shadow: 0 0 0 4px rgba(79, 172, 254, 0.2);
            color: white;
        }
        
        .form-floating > label {
            color: #a8c0ff;
        }
        
        .form-floating > .form-control:focus ~ label,
        .form-floating > .form-control:not(:placeholder-shown) ~ label {
            color: #4facfe;
            background: transparent;
            transform: scale(0.85) translateY(-0.5rem) translateX(0.15rem);
        }
        
        .form-control::placeholder {
            color: transparent;
        }
        
        .btn-admin-login {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border: none;
            color: #0f2027;
            font-weight: 700;
            font-size: 1.1rem;
            padding: 0.8rem;
            border-radius: 12px;
            transition: all 0.3s ease;
            margin-top: 1rem;
            width: 100%;
        }
        
        .btn-admin-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 242, 254, 0.3);
            color: #0f2027;
        }
        
        .shield-icon {
            font-size: 3rem;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pulse-glow 2s infinite alternate;
            margin-bottom: 1rem;
        }
        
        @keyframes pulse-glow {
            0% { filter: drop-shadow(0 0 5px rgba(0, 242, 254, 0.4)); }
            100% { filter: drop-shadow(0 0 15px rgba(0, 242, 254, 0.8)); }
        }

        .alert {
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid rgba(220, 53, 69, 0.5);
            color: #ffb3b3;
            border-radius: 12px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="admin-login-card">
        <div class="text-center">
            <i class="fa-solid fa-shield-halved shield-icon"></i>
            <h3 class="admin-login-title">Yönetici Girişi</h3>
            <p class="admin-login-subtitle">Avrasya Demirbaş Sistemi</p>
        </div>
        
        {% if form.errors %}
            <div class="alert text-center p-2 mb-4">
                <i class="fa-solid fa-circle-exclamation me-1"></i> Kullanıcı adı veya şifre hatalı.
            </div>
        {% endif %}
        
        <form method="post">
            {% csrf_token %}
            <div class="form-floating mb-3">
                <input type="text" name="username" class="form-control" id="id_username" placeholder="Kullanıcı Adı" required autofocus>
                <label for="id_username"><i class="fa-solid fa-user-shield me-2"></i>Kullanıcı Adı</label>
            </div>
            <div class="form-floating mb-4">
                <input type="password" name="password" class="form-control" id="id_password" placeholder="Şifre" required>
                <label for="id_password"><i class="fa-solid fa-key me-2"></i>Şifre</label>
            </div>
            <button type="submit" class="btn-admin-login">
                <i class="fa-solid fa-unlock-keyhole me-2"></i> Güvenli Giriş Yap
            </button>
            <input type="hidden" name="next" value="{{ next|default:'/' }}">
        </form>
    </div>

</body>
</html>
